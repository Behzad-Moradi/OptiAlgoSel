services:

  postgres:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optialgosel_pg

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optialgosel_pg"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: public.ecr.aws/b4i7j1y4/optialgosel:1.0

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: optialgosel_pg
      DB_USER: postgres
      DB_PASSWORD: postgres

      DATABASE_PATH: database/optialgosel.db
      MODEL_PATH: TrainedModels
      MODEL_REGISTRY: TrainedModels/model_registry.json

      SENDER_EMAIL: test@example.com
      APP_PASSWORD: fake-password

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: