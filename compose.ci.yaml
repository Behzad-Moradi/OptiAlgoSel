services:
  postgres:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optialgosel_pg

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optialgosel_pg"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DATABASE_PATH: database/optialgosel.db
      MODEL_PATH: models
      MODEL_REGISTRY: models/registry
      SENDER_EMAIL: test@example.com
      APP_PASSWORD: fake-password

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: optialgosel_pg
      DB_USER: postgres
      DB_PASSWORD: postgres

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy