deploy-test:
  runs-on: ubuntu-latest

  steps:
    - name: Test SSH connection
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          echo "Connected to EC2!"
          hostname
          docker --version