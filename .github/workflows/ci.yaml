name: OptiAlgoSel CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start PostgreSQL
        run: |
          docker compose -f compose.ci.yaml up -d postgres

          echo "Waiting for PostgreSQL..."
          until docker compose -f compose.ci.yaml exec -T postgres \
            pg_isready -U postgres -d optialgosel_pg; do
            sleep 2
          done
          echo "PostgreSQL is ready."

      - name: Restore database
        env:
          PGPASSWORD: postgres
        run: |
          docker run --rm \
            --network optialgosel_default \
            -v "$GITHUB_WORKSPACE:/work" \
            -e PGPASSWORD=postgres \
            postgres:18 \
            pg_restore \
              -h postgres \
              -p 5432 \
              -U postgres \
              -d optialgosel_pg \
              --no-owner \
              --no-acl \
              --exit-on-error \
              /work/database/optialgosel_ci_small.dump

      - name: Run tests
        
        run: |
          python -m pytest

      - name: Start full CI stack
        run: |
          docker compose -f compose.ci.yaml up -d

      - name: Wait for API

        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8000/ > /dev/null; then
              echo "API is ready."
              exit 0
            fi
            
            echo "API not ready yet..."
            sleep 2
          done
          
          echo "API failed to start. Showing logs:"
          docker compose -f compose.ci.yaml logs api
          exit 1

      - name: Test welcome endpoint
        run: |
          curl --fail --show-error http://localhost:8000/

      - name: Test algorithms endpoint
        run: |
          curl --fail --show-error http://localhost:8000/algorithms/

      - name: Show API logs
        if: always()
        run: |
          docker compose -f compose.ci.yaml logs --tail=100 api

      - name: Stop CI stack
        if: always()
        run: |
          docker compose -f compose.ci.yaml down -v
