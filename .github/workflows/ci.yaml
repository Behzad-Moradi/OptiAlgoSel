name: AWS OIDC Test

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  aws-test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write    # Must be set to write for OIDC handshake
      contents: read     # Required to read repository details

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::655103423443:role/OptiAlgoSelGitHubActionsRole
          aws-region: ap-southeast-2

      - name: Test AWS identity
        run: |
          aws sts get-caller-identity