name: OptiAlgoSel CI/CD

on:
  push:
  pull_request:

jobs:

  # ============================================================
  # JOB 0: GENERATE IMAGE VERSION
  # ============================================================
  version:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::655103423443:role/OptiAlgoSelGitHubActionsRole
          aws-region: us-east-1

      - name: Calculate next image version
        id: version
        run: |
          echo "Checking existing ECR images..."

          LATEST_VERSION=$(aws ecr-public describe-images \
            --repository-name optialgosel \
            --region us-east-1 \
            --query 'sort_by(imageDetails[?imageTags[0] != `null`], &imageTags[0])[-1].imageTags[0]' \
            --output text)

          echo "Latest version: $LATEST_VERSION"

          if [[ "$LATEST_VERSION" == "None" || -z "$LATEST_VERSION" ]]; then
            NEW_VERSION="1.0"
          else
            MAJOR=$(echo "$LATEST_VERSION" | cut -d. -f1)
            MINOR=$(echo "$LATEST_VERSION" | cut -d. -f2)

            NEW_MINOR=$((MINOR + 1))

            NEW_VERSION=LATEST_VERSION
          fi

          echo "New version: $NEW_VERSION"

          echo "image_tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 3: DEPLOY TO EC2
  # ============================================================
  deploy:
    needs:
      - version


    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::655103423443:role/OptiAlgoSelGitHubActionsRole
          aws-region: ap-southeast-2

      - name: Get EC2 public IP
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "Current EC2 public IP: $EC2_IP"
          echo "EC2_IP=$EC2_IP" >> "$GITHUB_ENV"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |
           set -e

            cd ~/optialgosel

            export IMAGE_TAG=${{ needs.version.outputs.image_tag }}

            echo "Logging in to Amazon ECR Public..."

            aws ecr-public get-login-password \
              --region us-east-1 | \
              docker login \
                --username AWS \
                --password-stdin public.ecr.aws

            echo "Pulling image..."

            docker pull \
              public.ecr.aws/b4i7j1y4/optialgosel:${{ needs.version.outputs.image_tag }}

            echo "Starting API..."

            docker compose \
              -f compose.production.rds.yaml \
              up -d api

            echo "Deployment status:"

            docker compose \
              -f compose.production.rds.yaml \
              ps

            echo "Running image:"

            docker inspect optialgosel-api-1 \
              --format '{{.Config.Image}}'