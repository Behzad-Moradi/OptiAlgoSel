name: OptiAlgoSel CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optialgosel_pg

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d optialgosel_pg"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore database
        env:
          PGPASSWORD: postgres
        run: |
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE:/work" \
            -e PGPASSWORD=postgres \
            postgres:18 \
            pg_restore \
              -h localhost \
              -p 5432 \
              -U postgres \
              -d optialgosel_pg \
              --no-owner \
              --no-acl \
              --exit-on-error \
              /work/database/optialgosel_ci_small.dump

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: optialgosel_pg
          DB_USER: postgres
          DB_PASSWORD: postgres
          DATABASE_PATH: database/optialgosel.db
          MODEL_PATH: models
          MODEL_REGISTRY: models/registry
          SENDER_EMAIL: test@example.com
          APP_PASSWORD: fake-password

        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t optialgosel-api:ci .

      - name: Run Docker container
        run: |
          docker run -d \
            --name optialgosel-api \
            -p 8000:8000 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5432 \
            -e DB_NAME=optialgosel_pg \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            optialgosel-api:ci

      - name: Test welcome endpoint
        run: |
          sleep 5
          curl --fail http://localhost:8000/welcome

      - name: Test algorithms endpoint
        run: |
          curl --fail --show-error http://localhost:8000/algorithms