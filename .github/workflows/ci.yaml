name: AWS OIDC Test

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  aws-test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write    # Must be set to write for OIDC handshake
      contents: read     # Required to read repository details

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC token
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::655103423443:role/OptiAlgoSelGitHubActionsRole
          aws-region: ap-southeast-2

      - name: Test AWS identity
        run: |
          aws sts get-caller-identity