name: OptiAlgoSel CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start PostgreSQL
        run: |
          docker compose -f compose.ci.yaml up -d postgres
          echo "Waiting for PostgreSQL..."
          until docker compose -f compose.ci.yaml exec -T postgres \
            pg_isready -U postgres -d optialgosel_pg; do
            sleep 2
          done
          echo "PostgreSQL is ready."

      - name: Restore database
        env:
          PGPASSWORD: postgres
        run: |
          docker run --rm \
            --network optialgosel_default \
            -v "$GITHUB_WORKSPACE:/work" \
            -e PGPASSWORD=postgres \
            postgres:18 \
            pg_restore \
              -h postgres \
              -p 5432 \
              -U postgres \
              -d optialgosel_pg \
              --no-owner \
              --no-acl \
              --exit-on-error \
              /work/database/optialgosel_ci_small.dump

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: optialgosel_pg
          DB_USER: postgres
          DB_PASSWORD: postgres
          DATABASE_PATH: database/optialgosel.db
          MODEL_PATH: models
          MODEL_REGISTRY: models/registry
          SENDER_EMAIL: test@example.com
          APP_PASSWORD: fake-password

        run: |
          python -m pytest

      - name: Start full CI stack
        run: |
          docker compose -f compose.ci.yaml up -d

      - name: Show Compose status
        run: |
          docker compose -f compose.ci.yaml ps

      - name: Show Compose logs
        run: |
          docker compose -f compose.ci.yaml logs

      - name: Check CI stack
        run: |
          docker compose -f compose.ci.yaml ps
          docker compose -f compose.ci.yaml logs --tail=100 api
      
      - name: Wait for API
        run: |
          sleep 10
          docker compose -f compose.ci.yaml ps
          docker compose -f compose.ci.yaml logs --tail=100 api

      - name: Stop CI stack
        if: always()
        run: |
          docker compose -f compose.ci.yaml down -v